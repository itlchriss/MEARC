ensures:
- Given the _type_integer_array param_nums and the _type_integer param_k , the result is the total number of continuous subarrays whose sum equals to param_k.
requires:
- Example 1:.
- 'Input: nums = arr_a , k = 2.'
- 'Output: 2.'
- Example 2:.
- 'Input: nums = arr_a , k = 3.'
- 'Output: 2.'
- Constraints:.
- <code>1 <= nums.length <= 2 10<sup>4</sup></code>.
- ' expr_a.'
- <code>-10<sup>7</sup> <= k <= 10<sup>7</sup></code>.
