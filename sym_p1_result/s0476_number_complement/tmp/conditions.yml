ensures:
- Given the _type_integer param_num , the result is its complement.
requires:
- The complement of the _type_integer is the integer you get when you flip all the expr_a's to expr_b's and all the expr_c's to expr_d's in its binary representation.
- For example , The integer expr_a is  expr_a.
- Example 1:.
- 'Input: num = 5.'
- 'Output: 2.'
- 'Explanation: The binary representation of 5 is 101 (no leading 0 bits) , and its complement is 10.'
- So you need to output 2.
- Example 2:.
- 'Input: num = 1.'
- 'Output: 0.'
- 'Explanation: The binary representation of 1 is 1 (no leading 0 bits) , and its complement is 0.'
- So you need to output 0.
- Constraints:.
- <code>1 <= num < 2<sup>31</sup></code>.
- 'Note: This question is the same as 1009: [https://leetcode.com/problems/complement-of-base-10-integer/](https://leetcode.com/problems/complement-of-base-10-integer/).'
