ensures:
- Given 2 binary strings param_a and param_b , the result is their sum as a binary string.
requires:
- Example 1:.
- 'Input: a = stry_a , b = stry_b.'
- 'Output: stry_a.'
- Example 2:.
- 'Input: a = stry_a , b = stry_b.'
- 'Output: stry_a.'
- Constraints:.
- <code>1 <= a.length , b.length <= 10<sup>4</sup></code>.
- param_a and param_b consist only of expr_a or the expr_b characters.
- Each string does not contain leading zeros except for the 0 itself.
