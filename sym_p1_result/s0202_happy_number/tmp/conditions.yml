ensures: []
requires:
- Write an algorithm to determine if a number param_n is happy.
- A happy number is a number defined by the following process:.
- Starting with any positive integer , replace the number by the sum of the squares of its digits.
- Repeat the process until the number equals 1 ( that it will stay) , or it loops endlessly in a cycle which does not include 1.
- Those numbers for which this process ends in 1 are happy.
- Return expr_a if param_n is a happy number , and expr_b if not.
- Example 1:.
- 'Input: n = 19.'
- 'Output: true.'
- Explanation:.
- 82 = 82.
- 68 = 68.
- 100 = 100.
- 1 = 1.
- Example 2:.
- 'Input: n = 2.'
- 'Output: false.'
- Constraints:.
- <code>1 <= n <= 2147483648 - 1</code>.
