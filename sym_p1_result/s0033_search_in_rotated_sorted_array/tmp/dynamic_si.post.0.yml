- term: expr_a
  syntax:
  - NN
  arguments:
  - symbol: '*'
    primitive_type: any
    reference_type: any
  synthesised_datatype:
  - primitive_type: undefined
    reference_type: string
  interpretation: k
- term: expr_b
  syntax:
  - NN
  arguments:
  - symbol: '*'
    primitive_type: any
    reference_type: any
  synthesised_datatype:
  - primitive_type: undefined
    reference_type: string
  interpretation: 1 <= k < nums.length
- term: expr_c
  syntax:
  - NN
  arguments:
  - symbol: '*'
    primitive_type: any
    reference_type: any
  synthesised_datatype:
  - primitive_type: undefined
    reference_type: string
  interpretation: '[nums[k] , nums[k+1] , ... , nums[n-1] , nums[0] , nums[1] , ...
    , nums[k-1]]'
