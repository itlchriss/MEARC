ensures:
- What should we the result is when param_needle is an empty string?.
- For the purpose of this problem , we will the result is 0 when param_needle is an empty string.
requires:
- Implement [strStr()](http://www.cplusplus.com/reference/cstring/strstr/).
- Return the index of the first occurrence of needle in haystack , or the expr_a if param_needle is not part of param_haystack.
- Clarification:.
- This a great question to ask during an interview.
- This consistent to C's [strstr()](http://www.cplusplus.com/reference/cstring/strstr/) and Java's [indexOf()](https://docs.oracle.com/javase/7/docs/api/java/lang/String.html#indexOf(java.lang.
- String)).
- Example 1:.
- 'Input: haystack = stry_a , needle = stry_b.'
- 'Output: 2.'
- Example 2:.
- 'Input: haystack = stry_a , needle = stry_b.'
- 'Output: negative 1.'
- Example 3:.
- 'Input: haystack = "" , needle = "".'
- 'Output: 0.'
- Constraints:.
- <code>0 <= haystack.length , needle.length <= 5 10<sup>4</sup></code>.
- param_haystack and param_needle only contain lower-case English characters.
