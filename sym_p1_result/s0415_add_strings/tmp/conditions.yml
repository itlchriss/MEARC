ensures:
- Given 2 non-negative integers , param_num1 and param_num2 represented as string , the result is the sum of param_num1 and param_num2 as the _type_string .
requires:
- You must solve the problem without using any built-in library for handling large integers (such as expr_a).
- You must also not convert the inputs to integers directly.
- Example 1:.
- 'Input: num1 = stry_a , num2 = stry_b.'
- 'Output: stry_a.'
- Example 2:.
- 'Input: num1 = stry_a , num2 = stry_b.'
- 'Output: stry_a.'
- Example 3:.
- 'Input: num1 = stry_a , num2 = stry_b.'
- 'Output: stry_a.'
- Constraints:.
- <code>1 <= num1.length , num2.length <= 10<sup>4</sup></code>.
- param_num1 and param_num2 only contain digits.
- param_num1 and param_num2 don't have any leading zeros except for the 0 itself.
