ensures:
- Given the _type_string param_s , find the first non-repeating character in it and the result is its index.
- If it does not exist , the result is expr_a.
requires:
- Example 1:.
- 'Input: s = stry_a.'
- 'Output: 0.'
- Example 2:.
- 'Input: s = stry_a.'
- 'Output: 2.'
- Example 3:.
- 'Input: s = stry_a.'
- 'Output: negative 1.'
- Constraints:.
- <code>1 <= s.length <= 10<sup>5</sup></code>.
- param_s only contains lowercase_alphabets .
