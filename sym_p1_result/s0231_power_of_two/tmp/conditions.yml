ensures:
- Given the _type_integer param_n , the result is expr_a if it is a power of 2.
- Otherwise , the result is expr_a.
requires:
- An integer param_n is a power of 2 , if there exists the _type_integer expr_a such that <code>n == 2<sup>x</sup></code>.
- Example 1:.
- 'Input: n = 1.'
- 'Output: true.'
- 'Explanation: 1 = 1.'
- Example 2:.
- 'Input: n = 16.'
- 'Output: true.'
- 'Explanation: 16 = 16.'
- Example 3:.
- 'Input: n = 3.'
- 'Output: false.'
- Example 4:.
- 'Input: n = 4.'
- 'Output: true.'
- Example 5:.
- 'Input: n = 5.'
- 'Output: false.'
- Constraints:.
- <code>-2147483648 <= n <= 2147483648 - 1</code>.
- 'Follow up: Could you solve it without loops/recursion?.'
