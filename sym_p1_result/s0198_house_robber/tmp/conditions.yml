ensures:
- Given the _type_integer array param_nums representing the amount of money of each house , the result is the maximum amount of money you can rob tonight without alerting the police.
requires:
- You are a professional robber planning to rob houses along a street.
- Each house has a certain amount of money stashed , the only constraint stopping you from robbing each of them is that adjacent houses have security systems connected and it will automatically contact the police if 2 adjacent houses were broken into on the same night.
- Example 1:.
- 'Input: nums = arr_a.'
- 'Output: 4.'
- Explanation:.
- Rob house 1 (money = 1) and then rob house 3 (money = 3).
- Total amount you can rob = 4 = 4.
- Example 2:.
- 'Input: nums = arr_a.'
- 'Output: 12.'
- Explanation:.
- Rob house 1 (money = 2) , rob house 3 (money = 9) and rob house 5 (money = 1).
- Total amount you can rob = 12 = 12.
- Constraints:.
- ' expr_a.'
- ' expr_a.'
