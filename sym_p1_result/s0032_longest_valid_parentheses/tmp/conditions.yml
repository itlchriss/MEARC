ensures: []
requires:
- Given the _type_string containing just leftp and rightp , find the length of the longest valid (well-formed) parentheses substring.
- Example 1:.
- 'Input: s = stry_a.'
- 'Output: 2.'
- 'Explanation: The longest valid parentheses substring is stry_a.'
- Example 2:.
- 'Input: s = stry_a.'
- 'Output: 4.'
- 'Explanation: The longest valid parentheses substring is stry_a.'
- Example 3:.
- 'Input: s = "".'
- 'Output: 0.'
- Constraints:.
- <code>0 <= s.length <= 3 10<sup>4</sup></code>.
- ' expr_a is leftp , or rightp.'
