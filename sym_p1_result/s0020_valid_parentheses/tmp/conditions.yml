ensures: []
requires:
- Given the _type_string param_s containing just leftp , rightp , leftb , rightb , leftbp and rightbp , determine if the input string is valid.
- An input string is valid if:.
- '1.'
- Open brackets is closed by the same type of brackets.
- '2.'
- Open brackets is closed in the correct order.
- Example 1:.
- 'Input: s = stry_a.'
- 'Output: true.'
- Example 2:.
- 'Input: s = stry_a.'
- 'Output: true.'
- Example 3:.
- 'Input: s = stry_a.'
- 'Output: false.'
- Example 4:.
- 'Input: s = stry_a.'
- 'Output: false.'
- Example 5:.
- 'Input: s = stry_a.'
- 'Output: true.'
- Constraints:.
- <code>1 <= s.length <= 10<sup>4</sup></code>.
- param_s consists of parentheses only expr_a.
