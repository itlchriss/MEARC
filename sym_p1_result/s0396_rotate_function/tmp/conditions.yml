ensures: []
requires:
- You are given the _type_integer array param_nums of length expr_a.
- Assume <code>arr<sub>k</sub></code> to be an array obtained by rotating param_nums by expr_a positions clock-wise.
- We define the rotation function expr_a on param_nums as follow:.
- <code>F(k) = 0 arr<sub>k</sub> arr_a + 1 arr<sub>k</sub> arr_b + ... + (n - 1) arr<sub>k</sub>[n - 1].</code>.
- Return the maximum value of expr_a.
- The test cases are generated so that the answer fits in a 32-bit integer.
- Example 1:.
- 'Input: nums = arr_a.'
- 'Output: 26.'
- Explanation:.
- F(0) = (0 4) + (1 3) + (2 2) + (3 6) = 25 = 25.
- F(1) = (0 6) + (1 4) + (2 3) + (3 2) = 16 = 16.
- F(2) = (0 2) + (1 6) + (2 4) + (3 3) = 23 = 23.
- F(3) = (0 3) + (1 2) + (2 6) + (3 4) = 26 = 26.
- So the maximum value of F(0) , F(1) , F(2) , F(3) is F(3) = 26.
- Example 2:.
- 'Input: nums = arr_a.'
- 'Output: 0.'
- Constraints:.
- ' expr_a.'
- <code>1 <= n <= 10<sup>5</sup></code>.
- ' expr_a.'
