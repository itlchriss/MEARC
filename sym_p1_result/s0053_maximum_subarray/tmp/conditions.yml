ensures:
- Given the _type_integer array param_nums , find the contiguous subarray (containing at least 1 number) which has the largest sum and the result is its sum.
requires:
- A subarray is a contiguous part of an array.
- Example 1:.
- 'Input: nums = arr_a.'
- 'Output: 6.'
- 'Explanation: arr_a has the largest sum = 6.'
- Example 2:.
- 'Input: nums = arr_a.'
- 'Output: 1.'
- Example 3:.
- 'Input: nums = arr_a.'
- 'Output: 23.'
- Constraints:.
- <code>1 <= nums.length <= 10<sup>5</sup></code>.
- <code>-10<sup>4</sup> <= nums[i] <= 10<sup>4</sup></code>.
- 'Follow up: If you have figured out the expr_a solution , try coding another solution using the divide and conquer approach , which is more subtle.'
