ensures:
- Given an unsorted array of integers param_nums , the result is the length of the longest consecutive elements sequence.
requires:
- You must write an algorithm that runs in expr_a time.
- Example 1:.
- 'Input: nums = arr_a.'
- 'Output: 4.'
- 'Explanation: The longest consecutive elements sequence is expr_a.'
- Therefore its length is 4.
- Example 2:.
- 'Input: nums = arr_a.'
- 'Output: 9.'
- Constraints:.
- <code>0 <= nums.length <= 10<sup>5</sup></code>.
- <code>-10<sup>9</sup> <= nums[i] <= 10<sup>9</sup></code>.
