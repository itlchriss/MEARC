ensures:
- Given a signed 32-bit integer param_x , the result is param_x with its digits reversed.
- If reversing param_x causes the value to go outside the signed 32-bit integer range <code> arr_a</code> , then the result is expr_a.
requires:
- Assume the environment does not allow you to store 64-bit integers (signed or unsigned).
- Example 1:.
- 'Input: x = 123.'
- 'Output: 321.'
- Example 2:.
- 'Input: x = negative 123.'
- 'Output: negative 321.'
- Example 3:.
- 'Input: x = 120.'
- 'Output: 21.'
- Example 4:.
- 'Input: x = 0.'
- 'Output: 0.'
- Constraints:.
- <code>-2147483648 <= x <= 2147483648 - 1</code>.
