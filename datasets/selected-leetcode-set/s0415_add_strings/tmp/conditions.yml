ensures:
- The type_string_ parameters expr0 and expr1 consist of only digits.
- The type_string_ parameters expr0 and expr1 don't have any leading zeros except
  for the zero itself.
- The length of the type_string_ parameters expr0 and expr1 is greater_than_or_equal
  to 1 and is less_than_or_equal to 10000.
- The type_string_ result is the sum of the type_string_ parameters expr0 and expr1
  as a type_string_.
requires: []
