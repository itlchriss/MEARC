ensures:
- The type_integer_ param_n_ is greater_than_or_equal to 1 and is less_than_or_equal to 16.
- The size of the type_integer_ type_collection_ result is equal to 2_pow_n.
- Every type_integer_ in the result is in the inclusive range [0 , 2_pow_n - 1].
- The first type_integer_ in the result is 0.
- Each type_integer_ in the result appears no more than once.
- The binary representation of every pair of adjacent integers in the result differs by one bit.
- The binary representation of the first and last integers in the result differs by one bit.
