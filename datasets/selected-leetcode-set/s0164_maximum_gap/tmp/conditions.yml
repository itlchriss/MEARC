ensures:
- The type_integer_ result is the maximum difference between two successive elements in the sorted form of the type_integer_ type_array_ param_nums_.
- The type_integer_ result is less_than_or_equal to the maximum value of java type_integer_ and is greater_than_or_equal to 0.
