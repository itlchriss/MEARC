ensures:
- The type_string_ result is a valid Roman numeral representation of the type_integer_ param_num_.
- The type_string_ result is constructed following the rules of Roman numerals that subtraction is used in specific cases.
- The type_string_ result is written largest to smallest from left to right.
- The type_string_ result does not contain invalid Roman numeral combinations.
- The type_string_ result does not contain more than three consecutive identical symbols.
requires:
- The type_integer_ param_num_ is greater_than_or_equal to 1 and is less_than_or_equal to 3999.
