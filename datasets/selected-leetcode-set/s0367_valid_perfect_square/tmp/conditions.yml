ensures:
- If the positive type_integer_ param_num_ is a perfect square , the type_boolean_ result is equal to the true literal.
- If the positive type_integer_ param_num_ is not a perfect square , the type_boolean_ result is equal to the false literal.
requires:
- The positive type_integer_ param_num_ is greater_than_or_equal to 1 and is less_than_or_equal to 2147483647.
