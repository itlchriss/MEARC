ensures:
- The type_string_ result is the corresponding column title of the type_integer_ param_columnNumber_ as it appears in an Excel sheet.
- The type_string_ result consists of uppercase_alphabets only.
- The type_string_ result is not null.
- The type_string_ result length is less_than_or_equal to 7.
requires:
- The type_integer_ param_columnNumber_ is greater_than_or_equal to 1 and is less_than_or_equal to 2147483647.
