ensures:
- The type_integer_ type_matrix_ param_matrix_ is not null.
- The type_integer_ type_matrix_ param_matrix_'s length is equal to expr_a and each row in the matrix's length is equal to expr_b.
- The type_integer_ result is a type_list_ of all elements of the type_matrix_ in spiral order.
- The elements in the type_integer_ result type_list_ are ordered in a spiral manner starting from the top-left corner and moving clockwise.
- The length of the type_integer_ result type_list_ is equal to the total number of elements in the type_matrix_.
- All elements in the type_integer_ result type_list_ are unique.
- The type_integer_ values in the type_matrix_ are in the range of negative 100 to 100.
- The type_integer_ values in the type_matrix_ are included in the type_integer_ result type_list_ in the order they appear in the spiral traversal.
requires: []
