ensures:
- The type_integer_ result is the corresponding column number of the type_string_ param_columnTitle_.
- The type_integer_ result is greater_than_or_equal to 1 and is less_than_or_equal to 2147483647.
requires:
- The type_string_ param_columnTitle_ only contains  uppercase_alphabets  .
- The length of the type_string_ param_columnTitle_ is greater_than_or_equal to 1 and is less_than_or_equal to 7.
