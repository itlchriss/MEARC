ensures:
- If the type_string_  param_s_ is a subsequence of the type_string_  param_t_ ,  the
  type_boolean_ result is equal to the true literal.
- If the type_string_  param_s_ is not a subsequence of the type_string_  param_t_
  ,  the type_boolean_ result is equal to the false literal.
- The length of the type_string_  param_s_ is less_than_or_equal to 100.
- The length of the type_string_  param_t_ is less_than_or_equal to 10000.
- The type_string_ parameters expr0 and expr1 consist only of lowercase English letters.
