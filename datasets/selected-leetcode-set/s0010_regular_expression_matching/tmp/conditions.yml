ensures:
- The type_string_ param_s_ is not null.
- The type_string_ param_p_ is not null.
- The type_boolean_ result is equal to the true literal if the type_string_ param_s_ matches the pattern expr_a according to the regular expression rules specified.
- The type_boolean_ result is equal to the false literal if the type_string_ param_s_ does not match the pattern expr_a according to the regular expression rules specified.
- The length of the type_string_ param_s_ is greater_than_or_equal to 1 and is less_than_or_equal to 20.
- The length of the pattern expr_a is greater_than_or_equal to 1 and is less_than_or_equal to 30.
- The type_string_ param_s_ only contains  lowercase_alphabets  .
- The pattern expr_a only contains  lowercase_alphabets  , str_a , and str_b.
- For each appearance of the character str_a , there will be a previous valid character to match.
