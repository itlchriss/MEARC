ensures:
- The elements in the type_list_ result are all possible letter combinations that the digits in the type_string_ param_digits_ could represent.
- The elements in the type_list_ result are in any order.
requires:
- The type_string_ param_digits_ is not null.
- The type_string_ param_digits_ must contain digits from 2 to 9 inclusive.
- The length of the type_string_ param_digits_ is less_than_or_equal to 4.
