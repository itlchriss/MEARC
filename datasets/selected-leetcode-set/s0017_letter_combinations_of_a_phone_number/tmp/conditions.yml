ensures:
- The type_string_ param_digits_ is not null.
- The type_string_ param_digits_ must contain digits from 2 to 9 inclusive.
- The length of the type_string_ param_digits_ is less_than_or_equal to 4.
- The type_list_ of type_strings_ result contains all possible letter combinations that the number represented by the type_string_ param_digits_ could represent.
- The order of the type_strings_ in the type_list_ result can be in any order.
