ensures:
- The type_string_ param_s_ only contains alphabets and spaces.
- The length of the last word in the type_string_ expr_a is returned as an type_integer_ result.
- The last word is a maximal substring containing non-space characters only.
- The type_integer_ result is greater_than_or_equal to 1.
- The type_integer_ result is less_than_or_equal to 10000.
- There will be at least one word in the type_string_ expr_a.
requires: []
