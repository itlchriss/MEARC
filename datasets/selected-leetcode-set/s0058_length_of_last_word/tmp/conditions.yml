ensures:
- The type_integer_ result is the length of the last word in the type_string_ param_s_.
requires:
- The type_string_ param_s_ only contains alphabets and spaces `' '`.
- The length of the type_string_ param_s_ is greater_than_or_equal to 1 and is less_than_or_equal to 10000.
- A word is a maximal substring containing non-space characters only.
