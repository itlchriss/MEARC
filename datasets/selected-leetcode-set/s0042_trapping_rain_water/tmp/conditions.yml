ensures:
- The type_integer_ type_array_ param_height_ is not null.
- The type_integer_ type_array_ param_height_ is an elevation map that the width of each bar is 1.
- The type_integer_ result is the amount of water that can be trapped after raining.
- The type_integer_ result is greater_than_or_equal to 0.
- The type_integer_ result is less_than_or_equal to the maximum possible amount of water that can be trapped given the elevation map represented by the type_integer_ type_array_ param_height_.
