ensures:
- The type_integer_ type_list_ param_triangle_ is not null.
- The type_integer_ type_list_ param_triangle_'s length is greater_than_or_equal to 1 and is less_than_or_equal to 200.
- The length of each type_list_ in the type_integer_ type_list_ param_triangle_ is equal to the index of the type_list_ plus one.
- The type_integer_ result is the minimum path sum from the top to the bottom of the triangle.
- The type_integer_ result is calculated by moving to an adjacent number of the row below at each step.
- The type_integer_ result is calculated by summing the path with the smallest sum.
- The type_integer_ result is greater_than_or_equal to negative 10000 and is less_than_or_equal to 10000.
