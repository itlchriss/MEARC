ensures:
- The type_integer_ type_array_  param_data_ is a valid UTF-8 encoding.
- For a 1-byte character in the UTF-8 encoding ,  the first bit is 0 ,  followed by
  its Unicode code.
- For an n-bytes character in the UTF-8 encoding ,  the first n bits are all ones
  ,  the n + 1 bit is 0 ,  followed by n - 1 bytes with the most significant 2 bits
  being 10.
- The type_array_ param_data_ contains integers that only the least significant 8
  bits of each type_integer_ are used to store the data.
- Each type_integer_ in the type_array_ param_data_ is only 1 byte of data.
- The output is a type_boolean_ value indicating whether the type_array_ param_data_
  is a valid UTF-8 encoding.
requires: []
