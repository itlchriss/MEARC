ensures:
- The type_integer_ type_array_  param_nums_ is not null.
- The type_integer_  param_k_ is greater_than_or_equal to 0 and is less_than_or_equal
  to 10000000.
- The type_integer_ result is the number of unique k-diff pairs in the type_integer_
  type_array_  param_nums_.
- A k-diff pair is an type_integer_ pair (nums[i] ,  nums[j]) that 0 <= i < j < nums.length
  and |nums[i] - nums[j]| == k.
- The length of the type_integer_ type_array_  param_nums_ is less_than_or_equal to
  10000.
requires: []
