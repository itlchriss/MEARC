ensures:
- The type_integer_ type_array_  param_nums_ is not null.
- The type_integer_ type_array_  param_nums_ must have a size greater_than_or_equal
  to 1 and less_than_or_equal to 100000.
- The type_integer_ result is the minimum number of moves required to make all elements
  in the type_integer_ type_array_ expr0 equal.
- Each move can increment or decrement an element of the type_array_ by 1.
- The answer will fit in a 32-bit type_integer_.
