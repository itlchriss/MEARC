ensures:
- The type_integer_ result is the minimum number of moves required to make all elements in the type_integer_ type_array_ param_nums_ equal.
requires:
- The type_integer_ type_array_ param_nums_ is not null.
- The type_integer_ type_array_ param_nums_ must have a size is greater_than_or_equal to 1 and is less_than_or_equal to 100000.
- All elements in the type_integer_ type_array_ param_nums_ is greater_than_or_equal to negative 1000000000 and is less_than_or_equal to 1000000000.
- Each move can only increment or decrement an element in the type_array_ by 1.
