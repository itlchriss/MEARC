ensures:
- For each value in the type_integer_ type_array_  param_nums1_ ,  find the index
  expr0 in the type_integer_ type_array_  param_nums2_ such that the value in param_nums1_
  is equal to the value in param_nums2_ at index expr1.
- Determine the next greater element of the value in expr0 at index expr1 in the type_integer_
  type_array_ expr2.
- If there is no next greater element for a value in expr0 ,  the answer for that
  value is negative 1.
- The length of the type_integer_ type_array_ result is equal to the length of the
  type_integer_ type_array_  param_nums1_.
- All values in the type_integer_ type_array_ result are either the next greater element
  or negative 1.
