ensures:
- If the type_integer_ param_numerator_ is divided by the type_integer_ param_denominator_ and the result is a terminating decimal , the type_string_ result is equal to the division result in type_string_ format.
- If the type_integer_ param_numerator_ is divided by the type_integer_ param_denominator_ and the result is a recurring decimal , the type_string_ result contains the recurring part enclosed in parentheses.
- The length of the type_string_ result is less_than to 10000.
requires:
- If exist multiple valid answers for the recurring part , any of them can be returned.
