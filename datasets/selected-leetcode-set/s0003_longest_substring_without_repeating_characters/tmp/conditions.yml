ensures:
- The type_integer_ result is the length of the longest substring without repeating characters in the type_string_ param_s_.
- The type_integer_ result is greater_than_or_equal to 0.
requires:
- The type_string_ param_s_ contains alphabets , digits , symbols , and spaces.
- The length of the type_string_ param_s_ is less_than_or_equal to 50000.
