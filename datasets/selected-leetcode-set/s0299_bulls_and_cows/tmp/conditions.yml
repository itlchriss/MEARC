ensures:
- The type_string_  param_secret_ and the type_string_  param_guess_ must consist
  of digits only.
- The length of the type_string_  param_secret_ and the type_string_  param_guess_
  is greater_than_or_equal to 1 and is less_than_or_equal to 1000.
- The length of the type_string_  param_secret_ is equal to the length of the type_string_  param_guess_.
- The type_string_ result is formatted as "xAyB"  ,    that  x is the number of bulls
  and y is the number of cows.
- The number of bulls  is the digits in the guess that are in the correct position.
- The number of cows  is the digits in the guess that are in the secret number but
  are located in the wrong position.
- The bulls are counted first before counting the cows.
- If a digit in the guess can be rearranged to match a digit in the secret number  ,   it
  is counted as a cow.
- If  exist  duplicate digits in the guess and secret number  ,   they should be handled
  correctly in counting bulls and cows.
requires: []
