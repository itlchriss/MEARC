ensures:
- The type_string_ param_s_ must only contain digits.
- The type_integer_ result is the number of ways to decode the type_string_ param_s_.
- The type_integer_ result is guaranteed to fit in a 32-bit type_integer_.
- If the type_string_ param_s_ contains a character that is mapped to a number starting with 0 , the type_integer_ result is equal to 0.
- The type_integer_ result is the number of ways to decode the type_string_ param_s_ according to the given mapping of letters to numbers.
requires: []
