ensures:
- The type_string_ parameters expr_a and expr_b consist only of the type_character_ str_a or the type_character_ str_b.
- The length of the type_string_ parameters expr_a and expr_b is greater_than_or_equal to 1 and is less_than_or_equal to 10000.
- The type_string_ parameters expr_a and expr_b do not contain leading zeros except for the zero itself.
- The type_string_ result is the sum of the binary type_strings_ expr_a and expr_b.
- The type_string_ result only contains the type_character_ str_a or the type_character_ str_b.
requires: []
