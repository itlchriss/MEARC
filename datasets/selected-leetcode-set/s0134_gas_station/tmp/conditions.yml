ensures:
- The type_integer_ type_array_ param_gas_ and param_cost_ is not null.
- The length of the type_integer_ type_array_ param_gas_ and param_cost_ is equal to expr_a.
- All values in the type_integer_ type_array_ param_gas_ and param_cost_ are greater_than_or_equal to 0 and are less_than_or_equal to 10000.
- The type_integer_ result is the starting gas station's index if it is possible to travel around the circuit once in the clockwise direction.
- If it is not possible to travel around the circuit once , the type_integer_ result is negative 1.
requires: []
