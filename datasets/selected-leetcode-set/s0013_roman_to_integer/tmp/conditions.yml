ensures:
- The type_integer_ result is less_than_or_equal to 3999 and is greater_than_or_equal to 1.
- If the type_string_ param_s_ is equal to "III" , the type_integer_ result is equal to 3.
- If the type_string_ param_s_ is equal to "IV" , the type_integer_ result is equal to 4.
- If the type_string_ param_s_ is equal to "IX" , the type_integer_ result is equal to 9.
- If the type_string_ param_s_ is equal to "LVIII" , the type_integer_ result is equal to 58.
- If the type_string_ param_s_ is equal to "MCMXCIV" , the type_integer_ result is equal to 1994.
requires:
- The type_string_ param_s_ only contains the characters  expr_a.
- The length of the type_string_ param_s_ is greater_than_or_equal to 1 and is less_than_or_equal to 15.
