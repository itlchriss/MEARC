ensures:
- The type_integer_  param_n_ is greater_than_or_equal to 0 and is less_than_or_equal
  to 8.
- The type_integer_ result is the count of all numbers with unique digits in the range
  of 0 ≤ x < 10_pow_n.
- The count excludes numbers with repeating digits such as 11 ,  22 ,  33 ,  etc.
