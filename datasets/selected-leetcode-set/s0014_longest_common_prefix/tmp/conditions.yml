ensures:
- If exists a common prefix among the input type_strings_ , the type_string_ result is equal to the longest common prefix type_string_ amongst the type_array_ of type_strings_.
- If exists no common prefix among the input type_strings_ , the type_string_ result is equal to an empty type_string_ `""`.
- The length of the type_string_ result is less_than_or_equal to 200.
- The type_string_ result only contains lower-case alphabets .
requires: []
