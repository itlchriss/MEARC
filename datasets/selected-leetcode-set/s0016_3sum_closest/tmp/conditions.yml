ensures:
- The type_integer_ result is the sum of three integers in the type_integer_ type_array_ param_nums_ such that the sum is closest to the type_integer_ param_target_.
requires:
- The type_integer_ type_array_ param_nums_ is not null.
- The length of the type_integer_ type_array_ param_nums_ is greater_than_or_equal to 3 and is less_than_or_equal to 1000.
- All values in the type_integer_ type_array_ param_nums_ are greater_than_or_equal to negative 1000 and are less_than_or_equal to 1000.
- The type_integer_ param_target_ is greater_than_or_equal to negative 10000 and is less_than_or_equal to 10000.
