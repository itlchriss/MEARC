ensures:
- The type_integer_ param_n_ is greater_than_or_equal to 1 and is less_than_or_equal to 9.
- The result is a type_list_ of lists that each inner type_list_ is a unique board configuration of the n-queens' placement.
- Each inner type_list_ contains type_strings_ that str_a is a queen and str_b is an empty space on the chessboard.
- The solutions in the result type_list_ are unique from each other.
- The order of the solutions in the result type_list_ can be arbitrary.
requires: []
