- All values in the type_integer_ type_array_ param_nums_ are greater_than_or_equal to negative 30 and are less_than_or_equal to 30.
- The product of any prefix or suffix of the type_integer_ type_array_ param_nums_ is guaranteed to fit in a 32-bit type_integer_.
