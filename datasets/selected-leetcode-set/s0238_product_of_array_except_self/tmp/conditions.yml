ensures:
- The length of the type_integer_ type_array_ result is equal to the length of the type_integer_ type_array_ param_nums_.
- Each element in the type_integer_ type_array_ result is equal to the product of all elements in the type_integer_ type_array_ param_nums_ except the corresponding element at the same index.
requires:
