ensures: []
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 20 and is greater_than_or_equal to 0.
- All the values in the type_integer_array_ param_nums_ are unique.
- The type_integer_array_ param_nums_ is sorted in ascending_order .
- Each range in the list should be in the format stry_a if a is not equal to b , and in the format stry_b if a is equal to b.
- The ranges cover all the numbers in the array .
- Each element of the type_integer_array_ param_nums_ is covered by one of the ranges.
- There is no integer x such that x is in one of the ranges but not in expr_a.
