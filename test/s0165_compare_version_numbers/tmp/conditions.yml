ensures:
- If the type_integer_ result is equal to negative 1 , expr_a is less_than to the expr_b.
- If the type_integer_ result is equal to 1 , expr_a is greater_than to the expr_b.
- If the type_integer_ result is equal to 0 , expr_a is equal to expr_b.
- If the string param_version1_ is equal to str_a and the string param_version2_ is equal to str_b , the type_integer_ result is equal to 0.
- If the string param_version1_ is equal to str_a and the string param_version2_ is equal to str_b , the type_integer_ result is equal to 0.
- If the string param_version1_ is equal to str_a and the string param_version2_ is equal to str_b , the type_integer_ result is equal to negative 1.
- If the string param_version1_ is equal to str_a and the string param_version2_ is equal to str_b , the type_integer_ result is equal to 1.
- If the string param_version1_ is equal to str_a and the string param_version2_ is equal to str_b , the type_integer_ result is equal to negative 1.
requires:
- The length of the string param_version1_ is less_than_or_equal to 500 and is greater_than_or_equal to 1.
- The length of the string param_version2_ is less_than_or_equal to 500 and is greater_than_or_equal to 1.
- The string parameters expr_a and expr_b only contain digits and period.
- The string parameters expr_a and expr_b are valid version numbers.
- All the given revisions in expr_a and expr_b can be stored in a 32-bit integer.
