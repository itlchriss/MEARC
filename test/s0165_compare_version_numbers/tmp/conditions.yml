ensures:
- If the type_integer_ result is equal to negative 1 , expr_a is less_than to the expr_b.
- If the type_integer_ result is equal to 1 , expr_a is greater_than to the expr_b.
- If the type_integer_ result is equal to 0 , expr_a is equal to expr_b.
- If the type_string_ param_version1_ is equal to stry_a and the type_string_ param_version2_ is equal to stry_b , the type_integer_ result is equal to 0.
- If the type_string_ param_version1_ is equal to stry_a and the type_string_ param_version2_ is equal to stry_b , the type_integer_ result is equal to 0.
- If the type_string_ param_version1_ is equal to stry_a and the type_string_ param_version2_ is equal to stry_b , the type_integer_ result is equal to negative 1.
- If the type_string_ param_version1_ is equal to stry_a and the type_string_ param_version2_ is equal to stry_b , the type_integer_ result is equal to 1.
- If the type_string_ param_version1_ is equal to stry_a and the type_string_ param_version2_ is equal to stry_b , the type_integer_ result is equal to negative 1.
