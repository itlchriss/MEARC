ensures:
- If the type_integer_ param_num_ is positive , the type_string_ result is the hexadecimal representation of the type_integer_ param_num_.
- If the type_integer_ param_num_ is negative , the type_string_ result is the two's complement hexadecimal representation of the type_integer_ param_num_.
- All letters in the type_string_ result are lowercase characters.
- There are no leading zeros in the type_string_ result except for the zero itself.
- The length of the type_string_ result is less_than_or_equal to 8.
- The type_string_ result is equal to "1a" if the type_integer_ param_num_ is equal to 26.
- The type_string_ result is equal to "ffffffff" if the type_integer_ param_num_ is equal to negative 1.
requires: []
