ensures:
- The type_integer_ type_collection_ result is a type_list_ of lists representing the first expr_a rows of Pascal's triangle.
- Each inner type_list_ in the type_integer_ type_collection_ result is a row of Pascal's triangle.
requires:
- The type_integer_ param_numRows_ is greater_than_or_equal to 1 and is less_than_or_equal to 30.
- The first element of each inner type_list_ is always 1.
- The last element of each inner type_list_ is always 1.
- Each element in the inner lists (except the first and last elements) is the sum of the two numbers directly above it in the previous row.
