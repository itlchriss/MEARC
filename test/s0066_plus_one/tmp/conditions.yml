ensures:
- The length of the type_integer_array_ result is equal to the length of the type_integer_array_ param_digits_.
- If the last element of the type_integer_array_ param_digits_ is less_than to 9 , the last element of the type_integer_array_ result is equal to the last element of the type_integer_array_ param_digits_ plus 1.
- If the last element of the type_integer_array_ param_digits_ is equal to 9 , the last element of the type_integer_array_ result is equal to 0 and the second last element of the type_integer_array_ result is equal to the second last element of the type_integer_array_ param_digits_ plus 1.
- If all the elements of the type_integer_array_ param_digits_ are equal to 9 , the first element of the type_integer_array_ result is equal to 1 and all the other elements are equal to 0.
requires:
- The length of the type_integer_array_ param_digits_ is less_than_or_equal to 100 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_digits_ are less_than_or_equal to 9 and are greater_than_or_equal to 0.
