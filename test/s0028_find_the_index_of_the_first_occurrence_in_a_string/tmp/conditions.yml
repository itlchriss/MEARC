ensures:
- The type_integer_ result is less_than_or_equal to the length of the string param_haystack_ and is greater_than_or_equal to negative 1.
- If the string param_needle_ is an empty string , the type_integer_ result is equal to 0.
- If the string param_needle_ is not part of the string param_haystack_ , the type_integer_ result is equal to negative 1.
- If the string param_needle_ is part of the string param_haystack_ , the type_integer_ result is equal to the index of the first occurrence of param_needle_ in param_haystack_.
requires:
- The length of the string param_haystack_ is less_than_or_equal to 50000 and is greater_than_or_equal to 0.
- The length of the string param_needle_ is less_than_or_equal to 50000 and is greater_than_or_equal to 0.
