ensures:
- If the type_integer_ type_array_ param_nums_ contains elements that appear more than `⌊ n/3 ⌋` times , the type_integer_ type_list_ result contains those elements.
- The length of the type_integer_ type_list_ result is less_than_or_equal to the length of the type_integer_ type_array_ param_nums_.
- All values in the type_integer_ type_list_ result are unique.
- The type_integer_ type_list_ result is empty if exist no elements that appear more than `⌊ n/3 ⌋` times in the type_integer_ type_array_ param_nums_.
