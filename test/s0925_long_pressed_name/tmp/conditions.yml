ensures:
- The type_string_  param_name_ and the type_string_  param_typed_ consist of only
  lowercase English letters.
- The type_boolean_ result is equal to the true literal if it is possible that the
  type_string_  param_typed_ was generated by type_long_ pressing the characters in
  the type_string_  param_name_.
- The type_boolean_ result is equal to the false literal if it is not possible that
  the type_string_  param_typed_ was generated by type_long_ pressing the characters
  in the type_string_  param_name_.
- The length of the type_string_  param_name_ is greater_than_or_equal to 1 and is
  less_than_or_equal to 1000.
- The length of the type_string_  param_typed_ is greater_than_or_equal to 1 and is
  less_than_or_equal to 1000.
requires: []
