ensures:
- If the type_string_ param_typed_ contains all characters of the type_string_ param_name_ , the type_boolean_ result is equal to the true literal .
- If the type_string_ param_typed_ does not contain all characters of the type_string_ param_name_ , the type_boolean_ result is equal to the false literal .
- If a character in the type_string_ param_name_ is long pressed in the type_string_ param_typed_ , the type_boolean_ result is equal to the true literal .
- If a character in the type_string_ param_name_ is not long pressed in the type_string_ param_typed_ , the type_boolean_ result is equal to the false literal .
requires:
- The length of the type_string_ param_name_ is less_than_or_equal to 1000 and is greater_than_or_equal to 1.
- The length of the type_string_ param_typed_ is less_than_or_equal to 1000 and is greater_than_or_equal to 1.
- The string parameters expr_a and expr_b only contain lowercase_alphabets .
