ensures:
- If the type_string_ param_typed_ accontains the type_string_ param_name_ , the type_boolean_ result is equal to the true literal .
- If the type_string_ param_typed_ does not accontain the type_string_ param_name_ , the type_boolean_ result is equal to the false literal .
