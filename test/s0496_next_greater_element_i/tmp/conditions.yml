ensures:
- The type_integer_array_ result has a length equal to the length of the type_integer_array_ param_nums1_.
- If the type_integer_array_ param_nums1_ is equal to [4 , 1 , 2] and the type_integer_array_ param_nums2_ is equal to [1 , 3 , 4 , 2] , the type_integer_array_ result is equal to [-1 , 3 , -1].
- If the type_integer_array_ param_nums1_ is equal to [2 , 4] and the type_integer_array_ param_nums2_ is equal to [1 , 2 , 3 , 4] , the type_integer_array_ result is equal to [3 , -1].
requires:
- The length of the type_integer_array_ param_nums1_ is less_than_or_equal to 1000 and is greater_than_or_equal to 1.
- The length of the type_integer_array_ param_nums2_ is less_than_or_equal to 1000 and is greater_than_or_equal to the length of the type_integer_array_ param_nums1_.
- All the values in the type_integer_array_ param_nums1_ are unique.
- All the values in the type_integer_array_ param_nums2_ are unique.
- All the values in the type_integer_array_ param_nums1_ also appear in the type_integer_array_ param_nums2_.
