ensures:
- The type_integer_ result is equal to the index of the type_integer_ param_target_ in the type_integer_array_ param_nums_ after considering the possible rotation.
- If the type_integer_ param_target_ is not in the type_integer_array_ param_nums_ , the type_integer_ result is equal to negative 1.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 5000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are unique.
- All the values in the type_integer_array_ param_nums_ are less_than_or_equal to 10000 and are greater_than_or_equal to negative 10000.
- The type_integer_ param_target_ is less_than_or_equal to 10000 and is greater_than_or_equal to negative 10000.
