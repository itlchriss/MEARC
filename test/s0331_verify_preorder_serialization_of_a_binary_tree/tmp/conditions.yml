ensures:
- If the type_string_ param_preorder_ is a correct preorder traversal serialization of a binary tree , the type_boolean_ result is equal to the true literal.
- If the type_string_ param_preorder_ is not a correct preorder traversal serialization of a binary tree , the type_boolean_ result is equal to the false literal.
requires:
- The length of the type_string_ param_preorder_ is greater_than_or_equal to 1 and is less_than_or_equal to 10000.
- Each value in the type_string_ param_preorder_ is either an type_integer_ in the range [0 , 100] or the character  expr_a.
- The values in the type_string_ param_preorder_ are separated by commas ' , '.
