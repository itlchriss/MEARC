ensures:
- The type_integer_array_ result is a list of key points sorted by their x-coordinate in the form expr_a.
requires:
- The length of the type_integer_array_ param_buildings_ is less_than_or_equal to 10000 and is greater_than_or_equal to 1.
- Each element in the type_integer_array_ param_buildings_ is an array of three integers expr_a.
- The integer value of expr_a is less_than_or_equal to the integer value of expr_b.
- The integer value of expr_a is greater_than_or_equal to 0 and is less_than_or_equal to 2147483647.
- The integer value of expr_a is greater_than_or_equal to 0 and is less_than_or_equal to 2147483647.
- The integer value of expr_a is greater_than_or_equal to 1 and is less_than_or_equal to 2147483647.
- Each key point is the left endpoint of a horizontal segment in the skyline except for the last point which always has a y-coordinate of 0.
- There are no consecutive horizontal lines of equal height in the output skyline.
- The ground between the leftmost and rightmost buildings is part of the skyline's contour.
