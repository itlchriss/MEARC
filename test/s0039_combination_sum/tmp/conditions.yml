ensures:
- The length of the type_integer_ type_array_ result is less_than_or_equal to 150.
- Each type_list_ in the type_list_ result is a unique combination of integers from the type_integer_ type_array_ param_candidates_ that sum up to the type_integer_ param_target_.
requires:
- Method behavioural specifications:.
- The type_integer_ type_array_ param_candidates_ is not null.
- The type_integer_ param_target_ is greater_than_or_equal to 1 and is less_than_or_equal to 500.
- The same number from the type_integer_ type_array_ param_candidates_ can be chosen multiple times in a combination.
- Two combinations are considered unique if the frequency of at least one chosen number is different.
