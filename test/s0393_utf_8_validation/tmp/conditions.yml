ensures: []
requires:
- The type_integer_ type_array_ param_data_ is a valid UTF-8 encoding if it follows the specified rules for UTF-8 characters.
- For a 1-byte character , the first bit is 0 , followed by its Unicode code.
- For an n-bytes character , the first n bits are all ones , the n + 1 bit is 0 , followed by n - 1 bytes with the most significant 2 bits being 10.
- The type_array_ param_data_ contains integers that only the least significant 8 bits of each type_integer_ are used to store the data.
- The method should return true if the type_array_ param_data_ is a valid UTF-8 encoding based on the specified rules.
- The method should return false if the type_array_ param_data_ does not represent a valid UTF-8 encoding based on the specified rules.
