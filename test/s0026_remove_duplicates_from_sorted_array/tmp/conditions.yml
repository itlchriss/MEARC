ensures:
- The type_integer_ result is equal to the number of unique elements in the type_integer_array_ param_nums_.
- The first expr_a elements of the type_integer_array_ param_nums_ should hold the final result after removing duplicates.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 30000 and is greater_than_or_equal to 0.
- All values in the type_integer_array_ param_nums_ are less_than_or_equal to 100 and are greater_than_or_equal to negative 100.
- The type_integer_array_ param_nums_ is sorted in ascending_order .
