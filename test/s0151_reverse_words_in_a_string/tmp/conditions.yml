ensures:
- The type_string_ result is a string of the words in reverse order concatenated by a single space.
requires:
- The length of the type_string_ param_s_ is less_than_or_equal to 10000 and is greater_than_or_equal to 1.
- The type_string_ param_s_ contains alphabets (upper-case and lower-case) , digits , and spaces expr_a.
- There is at least one word in expr_a.
- The reversed string should not contain leading or trailing spaces.
- Multiple spaces between two words in the reversed string should be reduced to a single space.
