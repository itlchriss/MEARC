ensures:
- If the type_boolean_ result is equal to the true literal , the total number of period characters in the type_string_ param_s_ is less_than to 2 and exist no sequences of 3 or more consecutive period characters.
- If the type_boolean_ result is equal to the false literal , the total number of period characters in the type_string_ param_s_ is greater_than_or_equal to 2 or exists at least one sequence of 3 or more consecutive period characters.
requires:
- The length of the type_string_ param_s_ is less_than_or_equal to 1000 and is greater_than_or_equal to 1.
- The type_string_ param_s_ only contains the characters str_a , or period.
