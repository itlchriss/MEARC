ensures:
- All strings in the list result are combinations of well-formed parentheses.
- The length of string in the list result is equal to 2 multiplied by the type_integer_ param_n_.
- The list result contains all possible combinations of well-formed parentheses for the expr_a pairs of parentheses.
requires:
- The type_integer_ param_n_ is greater_than_or_equal to 1 and is less_than_or_equal to 8.
