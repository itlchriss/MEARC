ensures:
- The type_integer_ result is the sum of the contiguous subarray in the type_integer_ type_array_ param_nums_ that has the largest sum.
- If exist multiple contiguous subarrays with the largest sum , any of them can be returned as the result.
requires:
- The type_integer_ type_array_ param_nums_ is not null.
- The contiguous subarray must contain at least one number.
- The contiguous subarray is a contiguous part of the type_integer_ type_array_ param_nums_.
