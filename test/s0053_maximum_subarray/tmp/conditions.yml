ensures:
- The type_integer_ result is less_than_or_equal to the maximum value of java integer and is greater_than_or_equal to the minimum value of java integer.
- If the type_integer_array_ param_nums_ is equal to [-2 , 1 , negative 3 , 4 , negative 1 , 2 , 1 , negative 5 , 4] , the type_integer_ result is equal to 6.
- If the type_integer_array_ param_nums_ is equal to [1] , the type_integer_ result is equal to 1.
- If the type_integer_array_ param_nums_ is equal to [5 , 4 , negative 1 , 7 , 8] , the type_integer_ result is equal to 23.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 100000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are less_than_or_equal to 10000 and are greater_than_or_equal to negative 10000.
