ensures:
- If the type_boolean_ result is equal to the true literal , it means that for each customer , the correct change was provided such that the net transaction is that the customer pays $5.
- If the type_boolean_ result is equal to the false literal , it means that there was at least 1 customer for whom the correct change could not be provided.
- If the type_integer_array_ param_bills_ is equal to arr_a , the type_boolean_ result is equal to the true literal .
- If the type_integer_array_ param_bills_ is equal to arr_a , the type_boolean_ result is equal to the false literal .
requires:
- The length of the type_integer_array_ param_bills_ is less_than_or_equal to 100000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_bills_ are either 5 , 10 , or 20.
