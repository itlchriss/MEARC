ensures:
- The type_integer_ result is less_than_or_equal to the length of the type_integer_array_ param_nums_.
- The type_integer_ result is the number of unique k-diff pairs in the array.
- If the type_integer_array_ param_nums_ is equal to [3 , 1 , 4 , 1 , 5] and the type_integer_ param_k_ is equal to 2 , the type_integer_ result is equal to 2.
- If the type_integer_array_ param_nums_ is equal to [1 , 2 , 3 , 4 , 5] and the type_integer_ param_k_ is equal to 1 , the type_integer_ result is equal to 4.
- If the type_integer_array_ param_nums_ is equal to [1 , 3 , 1 , 5 , 4] and the type_integer_ param_k_ is equal to 0 , the type_integer_ result is equal to 1.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 10000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are less_than_or_equal to 10000000 and are greater_than_or_equal to negative 10000000.
- The type_integer_ param_k_ is less_than_or_equal to 10000000 and is greater_than_or_equal to 0.
