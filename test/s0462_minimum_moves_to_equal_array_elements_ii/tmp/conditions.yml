ensures:
- The type_integer_ result is less_than_or_equal to the maximum value of java integer and is greater_than_or_equal to the minimum value of java integer.
- If the type_integer_array_ param_nums_ is equal to [1 , 2 , 3] , the type_integer_ result is equal to 2.
- If the type_integer_array_ param_nums_ is equal to [1 , 10 , 2 , 9] , the type_integer_ result is equal to 16.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 100000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are less_than_or_equal to 1000000000 and are greater_than_or_equal to negative 1000000000.
