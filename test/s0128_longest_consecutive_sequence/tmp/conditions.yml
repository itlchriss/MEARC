ensures:
- The type_integer_ result is equal to the length of the longest consecutive elements sequence in the type_integer_array_ param_nums_.
- If the type_integer_array_ param_nums_ is equal to arr_a , the type_integer_ result is equal to 4.
- If the type_integer_array_ param_nums_ is equal to arr_a , the type_integer_ result is equal to 9.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 100000.
- All the values in the type_integer_array_ param_nums_ are less_than_or_equal to 1000000000 and are greater_than_or_equal to negative 1000000000.
