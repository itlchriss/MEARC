ensures:
- If the type_string_ param_s_ contains a non-repeating character , the type_integer_ result is equal to the index of the first non-repeating character in the type_string_ param_s_.
- If the type_string_ param_s_ does not contain a non-repeating character , the type_integer_ result is equal to negative 1.
requires:
- The length of the type_string_ param_s_ is greater_than_or_equal to 1 and is less_than_or_equal to 100000.
- The type_string_ param_s_ only contains  lowercase_alphabets  .
