ensures:
- If exists a non-repeating character in the string param_s_ , the type_integer_ result is the index of the first occurrence of that character.
- If exists no non-repeating character in the string param_s_ , the type_integer_ result is negative 1.
requires:
- The length of the string param_s_ is less_than_or_equal to 100000 and is greater_than_or_equal to 1.
- The string param_s_ only contains lowercase_alphabets .
