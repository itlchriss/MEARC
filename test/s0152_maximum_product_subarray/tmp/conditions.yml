ensures:
- The type_integer_ result is less_than_or_equal to the maximum value of a 32-bit integer and is greater_than_or_equal to the minimum value of a 32-bit integer.
- If the type_integer_array_ param_nums_ is equal to [2 , 3 , negative 2 , 4] , the type_integer_ result is equal to 6.
- If the type_integer_array_ param_nums_ is equal to [-2 , 0 , -1] , the type_integer_ result is equal to 0.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 20000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are less_than_or_equal to 10 and are greater_than_or_equal to negative 10.
