ensures:
- The type_integer_ result is the complement of the type_integer_ param_num_.
- The binary representation of the type_integer_ result is obtained by flipping all expr_a's to expr_b's and all expr_c's to expr_d's in the binary representation of the type_integer_ param_num_.
requires:
- The type_integer_ param_num_ is greater_than_or_equal to 1 and is less_than to 2147483648.
