ensures:
- The characters in the type_string_ result are sorted in decreasing order based on their frequency in the type_string_ param_s_.
- If exist multiple valid answers , any of them can be returned as the result.
requires:
- The length of the type_string_ param_s_ is less_than_or_equal to 500000 and is greater_than_or_equal to 1.
- The type_string_ param_s_ contains uppercase and lowercase_alphabets and digits.
