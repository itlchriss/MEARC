ensures:
- The length of the list result is equal to the factorial of the length of the type_integer_array_ param_nums_.
- Each element in the list result is a list of integers representing a permutation of the type_integer_array_ param_nums_.
- The order of permutations in the list result can be in any order.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 6 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are unique.
