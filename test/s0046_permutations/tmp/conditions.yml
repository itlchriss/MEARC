ensures:
- The size of the type_list_ result is equal to the factorial of the length of the type_integer_ type_array_ param_nums_.
- Each element in the type_list_ result is a permutation of the type_integer_ type_array_ param_nums_.
- The order of permutations in the type_list_ result can be in any order.
requires:
- The type_integer_ type_array_ param_nums_ is not null.
- The length of the type_integer_ type_array_ param_nums_ is greater_than_or_equal to 1 and is less_than_or_equal to 6.
- All values in the type_integer_ type_array_ param_nums_ are unique.
