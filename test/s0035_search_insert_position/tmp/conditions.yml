ensures:
- If the type_integer_ param_target_ is found in the type_integer_array_ param_nums_ , the type_integer_ result is equal to the index of the param_target_.
- If the type_integer_ param_target_ is not found in the type_integer_array_ param_nums_ , the type_integer_ result is equal to the index that the param_target_ would be if it were inserted in order.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 10000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are less_than_or_equal to 10000 and are greater_than_or_equal to negative 10000.
- All values in the type_integer_array_ param_nums_ are unique and sorted in ascending_order .
- The type_integer_ param_target_ is less_than_or_equal to 10000 and is greater_than_or_equal to negative 10000.
