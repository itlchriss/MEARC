ensures:
- The type_integer_ result is greater_than_or_equal to 1.
- If the type_integer_array_ param_nums_ is equal to [2 , 3 , 1 , 1 , 4] , the type_integer_ result is equal to 2.
- If the type_integer_array_ param_nums_ is equal to [2 , 3 , 0 , 1 , 4] , the type_integer_ result is equal to 2.
requires:
- The length of the type_integer_array_ param_nums_ is less_than_or_equal to 10000 and is greater_than_or_equal to 1.
- All the values in the type_integer_array_ param_nums_ are greater_than_or_equal to 0 and are less_than_or_equal to 1000.
